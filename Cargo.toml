[package]
name = "rustfront"
# 0.0.x tant que l'API n'est pas utilisable : 0.1.0 sera la première version
# qui intègre réellement une loi.
version = "0.0.1"
edition = "2024"
# Plancher de compilateur, fixé par `libloading` 0.9 qui déclare 1.88 (l'edition
# 2024 n'en demanderait que 1.85). Sans cette ligne, un utilisateur recevrait
# une erreur brute au lieu d'un message qui nomme la version attendue.
rust-version = "1.88"
authors = ["Gauthier F"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pyrucast/rustfront"
readme = "README.md"
# La recherche de crates.io porte sur le nom, la description et les mots-clés.
# Le nom ne contient pas « mfront » : la description et le premier mot-clé
# sont donc ce qui fait trouver la crate à qui tape « mfront ».
description = "Evaluate MFront material behaviours (constitutive laws) at a material point, in pure Rust, without MGIS or any C++ build dependency"
keywords = ["mfront", "tfel", "mechanics", "material", "fem"]
categories = ["science", "simulation", "api-bindings"]

# Lints ajoutés à ceux que clippy applique déjà.
# `unnecessary_wraps` refuse un `Result` qui ne peut jamais être une erreur, et
# une `Option` toujours `Some`. `clippy.toml` l'étend à l'API publique.
[lints.clippy]
unnecessary_wraps = "warn"

# Une seule dépendance : `libloading` ouvre la bibliothèque générée par MFront et
# y lit les symboles (dlopen/dlsym, LoadLibrary/GetProcAddress sous Windows).
[dependencies]
libloading = "0.9"

[package]
name = "rustfront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# crates.io searches the name, the description and the keywords. The name does
# not contain "mfront": the description and the first keyword are what makes
# the crate show up for whoever types "mfront".
description = "Evaluate MFront material behaviours (constitutive laws) at a material point, in pure Rust, without MGIS or any C++ build dependency"
keywords = ["mfront", "tfel", "mechanics", "material", "fem"]
categories = ["science", "simulation", "api-bindings"]
# Tooling of the repository, of no use in the published crate.
exclude = [".claude/", ".github/", "scripts/", "CLAUDE.md"]

[lints]
workspace = true

# The library at the root, and `mtest-rs`, the command line tool built on it.
[workspace]
members = ["mtest-rs"]

# Shared by both packages: one version for both, released together by a tag
# `vX.Y.Z` (see .github/workflows/release.yml, whose `check-version` job
# compares the tag with this version and with the one of the dependency below).
[workspace.package]
version = "0.5.0"
edition = "2024"
# Minimum compiler, set by `libloading` 0.9, which declares 1.88 (edition 2024
# alone would only need 1.85). Without this line, a user would get a raw error
# instead of a message naming the expected version. Checked by the `msrv` job
# of .github/workflows/ci.yml.
rust-version = "1.88"
authors = ["Gauthier F"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pyrucast/rustfront"

# `mtest-rs` depends on `rustfront` by path in the repository, and by version
# once published: crates.io needs the version, which must follow the one above.
[workspace.dependencies]
rustfront = { path = ".", version = "0.5.0" }

# Lints added to those clippy already applies, for both packages.
# `unnecessary_wraps` rejects a `Result` that can never be an error, and an
# `Option` that is always `Some`. `clippy.toml` extends it to the public API.
[workspace.lints.clippy]
unnecessary_wraps = "warn"

# A single dependency: `libloading` opens the library generated by MFront and
# reads its symbols (dlopen/dlsym, LoadLibrary/GetProcAddress on Windows).
[dependencies]
libloading = "0.9"

[package]
name = "mtest-rs"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["Gauthier F"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pyrucast/rustfront"
readme = "README.md"
description = "Unofficial, independent reimplementation in Rust of a subset of MTest (TFEL), built on rustfront: tests an MFront behaviour at one material point. Not affiliated with the TFEL project, CEA or EDF."
keywords = ["mfront", "mtest", "tfel", "mechanics", "material"]
categories = ["science", "simulation", "command-line-utilities"]
# Not published until rustfront, on which it depends, has a usable release.
publish = false

# No dependency but rustfront: the input parser, the expression evaluator and
# the linear solver are written by hand.
[dependencies]
rustfront = { path = ".." }

[lints]
workspace = true
